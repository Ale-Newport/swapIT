version: 2
# Version updates arrive as at most two grouped pull requests per ecosystem each
# week (minor/patch, and majors), so CI and review stay manageable. Security
# updates are separate and immediate. Every Dependabot PR still needs the
# maintainer's approval and green checks before it can be merged.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, javascript]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, rust]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
