version: 2
# Version updates arrive as at most two grouped pull requests per ecosystem each
# week (minor/patch, and majors), so CI and review stay manageable. Security
# updates are separate and immediate. Every Dependabot PR still needs the
# maintainer's approval and green checks before it can be merged.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, javascript]
    ignore:
      # js-yaml 5 changed its schema API; the migration is tracked in #30.
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1 only (TS 7 has no JS API yet):
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">= 7"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, rust]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
