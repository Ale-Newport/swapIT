version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    groups:
      tauri-js:
        patterns: ["@tauri-apps/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    groups:
      tauri-rust:
        patterns: ["tauri*", "objc2*", "block2"]
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
