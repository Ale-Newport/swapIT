[package]
name = "toolbox"
version = "0.1.0"
description = "Toolbox — a fast, local-first desktop toolkit for everyday file tasks."
authors = ["Toolbox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "~2.3.2"

# Native glass, Finder/drag integration. AppKit bindings are opt-in per class so the
# build only compiles what the radial layer touches.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSObject", "NSSet",
    "NSString", "NSURL", "NSValue", "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "bitflags", "libc", "NSAppearance", "NSApplication", "NSEvent", "NSImage",
    "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSView",
    "NSVisualEffectView", "NSWindow", "NSWorkspace", "NSGraphics",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "fs", "sync", "time"] }
walkdir = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1"
image = { version = "0.25", features = ["rayon"] }
kamadak-exif = "0.6"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
regex = "1"
which = "7"
mime_guess = "2"
dirs = "5"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
